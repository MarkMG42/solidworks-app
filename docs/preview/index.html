<!doctype html><html lang="ru"><meta charset="utf-8"><title>SW Tools Hub — предварительный просмотр</title><style>
@font-face{font-family:'Source Sans 3';src:url('../../addin/portable/Fonts/SourceSans3-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}

*{box-sizing:border-box}body{margin:0;background:#EDE4DF;font:18.667px 'Source Sans 3','Segoe UI',Arial,sans-serif;font-weight:700;color:#24231F;display:flex;justify-content:center;padding:20px}.window{width:902px;height:633px;background:#FDFCF8;border:1px solid #DDC8BF;border-radius:8px;overflow:hidden;box-shadow:0 16px 50px #0005}.titlebar{font-family:'Segoe UI',Arial,sans-serif;font-weight:400;height:31px;background:#F5EDE8;color:#18191c;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px}.titlebar span:last-child{letter-spacing:17px}.app{height:600px;display:flex;flex-direction:column}.header{height:64px;padding:12px 18px 12px 20px;display:flex;align-items:center;justify-content:space-between}strong{font-size:18.667px;font-weight:700}.toolbar{display:flex;gap:4px}button{border-radius:10px;border:1px solid #E3DCCF;font:inherit;cursor:pointer;color:inherit;background:#F8F3E8}.toolbar button{width:36px;height:36px;display:grid;place-items:center}.toolbar button:hover,.tile:hover{background:#F2E6D7}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linejoin:round;stroke-linecap:round}.toolbar .disabled{opacity:.35}.search{height:48px;margin:0 20px 8px;padding:10px 12px;background:#F8F3E8;border:1px solid #E3DCCF;border-radius:12px;display:flex;align-items:center;gap:8px}.search svg{width:15px;height:15px;color:#24231F}.search input{color:#24231F;background:transparent;border:0;outline:none;width:100%;font:inherit}.hint{height:30px;margin:0 20px;color:#24231F;font-size:18px}.modules{height:112px;margin:4px 20px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:18px}.tile .caption{display:flex;gap:9px;align-items:center}.tile svg{width:16px;height:16px}.tile small{font-size:18px;color:#24231F}.tile.active{background:#F2E6D7}.content{flex:1;min-height:0;margin:10px 20px 20px;padding:20px 14px;background:#F8F3E8;border:1px solid #E3DCCF;border-radius:12px;overflow:auto}h2{font-size:18.667px;margin:0 0 20px;font-weight:700}.empty{line-height:1.7;color:#24231F;margin:0;font-size:18px}.status{display:none;height:44px;color:#24231F;font-size:18px;padding:4px 20px}.footer{display:none;height:34px;padding:8px 20px;color:#24231F;font-size:18px}.tag{font-size:10px;color:#24231F;margin-top:15px}
.macro-row{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:stretch;gap:4px;margin:0 0 8px;min-height:80px}.macro-row button{padding:6px;background:#F8F3E8;border-color:#E3DCCF}.macro-name{text-align:left;min-width:0}.macro-name span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.macro-name small{display:block;margin-top:5px;color:#24231F;font:inherit;font-size:17.333px}.macro-name.selected{background:#F2E6D7}.row-play svg{width:17px;height:17px}.row-star{font-size:20px}
.header,.search,.hint,.modules{flex-shrink:0}
.tile,.macro-row button{background:#F8F3E8;color:#24231F;border-color:#E3DCCF}
.tile small,.macro-name small{color:#24231F}
.tile:hover,.tile.active,.macro-row button:hover,.macro-name.selected{background:#F2E6D7;border-color:#E3DCCF}
.toolbar button{background:#F8F3E8;color:#24231F;border-color:#E3DCCF}
.toolbar button:hover{background:#F2E6D7;border-color:#E3DCCF}
button:focus-visible{outline:2px solid #E3DCCF;outline-offset:2px}
.search:focus-within{border-color:#E3DCCF}
.search input::placeholder{color:#24231F;opacity:1}

.toolbar button,.macro-row .row-star,.macro-row .row-play{background:#F2E6D7;color:#706D61;border:1px solid #DEC7B1;border-radius:16px}
.toolbar button:hover,.macro-row .row-star:hover,.macro-row .row-play:hover{background:#EAD7C2;border-color:#C6C2B5}
.row-star,.row-play{align-self:center;justify-self:center;width:36px;height:36px;display:grid;place-items:center}
.row-star svg,.row-play svg{width:22px;height:22px}
.tile svg,.search svg{color:#706D61;stroke-width:1.35}

.window{background:#FDFCF8;border-color:#E3DCCF}
.tile,.content,.search,.macro-row button{border-color:#E3DCCF;background:#F8F3E8}
.tile,.content,.search{border-radius:16px}
.tile small,.macro-name small,.hint,.empty,.search input::placeholder{color:#706D61}
.tile:hover,.tile.active,.macro-name.selected{background:#F2E6D7;border-color:#C6C2B5}
.tile{gap:8px}.tile small{padding-left:25px}
.macro-row{border-bottom:1px solid #E3DCCF;padding-bottom:8px;margin-bottom:8px}
.macro-row .macro-name{border-color:transparent;background:transparent;border-radius:12px}
.macro-row .macro-name:hover,.macro-row .macro-name.selected{background:#F2E6D7}
.toolbar button,.macro-row .row-star,.macro-row .row-play{background:#F2E6D7;color:#706D61;border-color:#DEC7B1}
.toolbar button:hover,.macro-row .row-star:hover,.macro-row .row-play:hover{background:#EAD7C2;border-color:#C6C2B5}
button:focus-visible{outline:2px solid #706D61}
.search:focus-within{border-color:#706D61}

.tile svg,.macro-row .row-star,.macro-row .row-play{color:#A96347}
.tile:hover,.tile.active,.macro-name.selected,.macro-row .macro-name:hover,.macro-row .macro-name.selected{background:#F0E7D8}
</style><body><div class="window"><div class="titlebar"><span>▦ &nbsp; SW Tools Hub</span><span>− □ ×</span></div><main class="app"><header class="header"><strong>SW Tools Hub</strong><div class="toolbar"><button class="disabled" title="Выберите макрос для запуска"><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg></button><button title="Выбрать папку библиотеки" onclick="document.getElementById('status').textContent='В приложении откроется системный выбор папки Windows.'"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10H3Z"/></svg></button></div></header><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input aria-label="Поиск макросов" oninput="render()" placeholder="Найти макрос…"></div><div class="hint">Поиск макросов</div><section class="modules"><button class="tile" onclick="show('Детали',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 3 9 5v10l-9 5-9-5V8Zm0 10 9-5M3 8l9 5v10"/></svg>Детали</span><small>0 макросов</small></button><button class="tile" onclick="show('Чертежи',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5Zm10 0v5h4M8 12h8M8 16h5"/></svg>Чертежи</span><small>0 макросов</small></button><button class="tile" onclick="show('Сборки',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 2 5 3v6l-5 3-5-3V5Zm-5 9-5 3v6l5 3 5-3v-6Zm10 0-5 3v6l5 3 5-3v-6Z"/></svg>Сборки</span><small>0 макросов</small></button><button class="tile" onclick="show('Лазер',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M7 3h10v5l-5 4-5-4Zm5 9v7M3 21h18M6 13l-3 3m15-3 3 3"/></svg>Лазер</span><small>0 макросов</small></button></section><section class="content"><h2 id="heading">Избранные инструменты</h2><div id="rows"></div><p class="empty" id="empty">Нажмите ☆ рядом с макросом в разделе,<br>чтобы добавить его в избранное.</p></section><div class="status" id="status">Добавьте .swp в папки разделов библиотеки.</div><footer class="footer">0 инструментов · Portable</footer></main></div><script>
// Данные только для предварительного просмотра: рабочие .swp не добавляются.
const macros=[{name:'Авторазмер Рамы',category:'Чертежи',favorite:true},{name:'Экспорт DXF',category:'Лазер',favorite:true}];
let section=null, selected=null;
function show(title,button){section=section===title?null:title;render()}
function render(){const query=document.querySelector('input').value.trim().toLowerCase();const home=!section&&!query;document.getElementById('heading').textContent=home?'Избранные инструменты':query?'Результаты поиска':section;document.querySelectorAll('.tile').forEach((tile,i)=>{const category=['Детали','Чертежи','Сборки','Лазер'][i];tile.classList.toggle('active',section===category);tile.querySelector('small').textContent=macros.filter(m=>m.category===category).length+' макросов'});const visible=macros.filter(m=>(!section||m.category===section)&&(!home||m.favorite)&&m.name.toLowerCase().includes(query));const rows=document.getElementById('rows');rows.replaceChildren();visible.forEach(m=>{const row=document.createElement('div');row.className='macro-row';const star=document.createElement('button');star.className='row-star';star.innerHTML='<svg viewBox="0 0 24 24" style="fill:'+(m.favorite?'#E8BDA2':'none')+'"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg>';star.title=(m.favorite?'Убрать из избранного: ':'В избранное: ')+m.name;star.onclick=()=>{m.favorite=!m.favorite;render()};const name=document.createElement('button');name.className='macro-name'+(selected===m?' selected':'');const title=document.createElement('span');title.textContent=m.name;name.append(title);if(home){const subtitle=document.createElement('small');subtitle.textContent=m.category;name.append(subtitle)}name.onclick=()=>{selected=m;render()};const play=document.createElement('button');play.className='row-play';play.title='Запустить: '+m.name;play.innerHTML='<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg>';play.onclick=()=>{selected=m;render()};row.append(star,name,play);rows.append(row)});document.getElementById('empty').style.display=visible.length?'none':'block';document.getElementById('empty').textContent=home?'Нажмите ☆ рядом с макросом в разделе, чтобы добавить его в избранное.':'Макросов пока нет. Измените запрос или раздел.';const play=document.querySelector('.toolbar button');play.classList.toggle('disabled',!visible.includes(selected));play.title=visible.includes(selected)?'Выбрать процедуру и запустить: '+selected.name:'Выберите макрос для запуска'}
render();
</script></body></html>

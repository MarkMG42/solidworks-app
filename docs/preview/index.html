<!doctype html><html lang="ru"><meta charset="utf-8"><title>SW Tools Hub — предварительный просмотр</title><style>
@font-face{font-family:'Source Sans 3';src:url('../../addin/portable/Fonts/SourceSans3-Semibold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:block}

*{box-sizing:border-box}body{margin:0;background:#26282c;font:15.333px 'Source Sans 3','Segoe UI',Arial,sans-serif;font-weight:600;color:#ebecee;display:flex;justify-content:center;padding:20px}.window{width:390px;height:792px;background:#0f1012;border:1px solid #46484e;border-radius:8px;overflow:hidden;box-shadow:0 16px 50px #0005}.titlebar{font-family:'Segoe UI',Arial,sans-serif;font-weight:400;height:31px;background:#ece9f1;color:#18191c;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px}.titlebar span:last-child{letter-spacing:17px}.app{height:760px;display:flex;flex-direction:column}.header{height:64px;padding:12px 18px 12px 20px;display:flex;align-items:center;justify-content:space-between}strong{font-size:15.333px;font-weight:600}.toolbar{display:flex;gap:4px}button{border-radius:10px;border:1px solid #2b2e33;font:inherit;cursor:pointer;color:inherit;background:#181a1d}.toolbar button{width:36px;height:36px;display:grid;place-items:center}.toolbar button:hover,.tile:hover{background:#2f3339}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.toolbar .disabled{opacity:.35}.search{height:40px;margin:0 20px 8px;padding:10px 12px;background:#181a1d;border:1px solid #34373c;border-radius:12px;display:flex;align-items:center;gap:8px}.search svg{width:15px;height:15px;color:#92979e}.search input{color:#ebecee;background:transparent;border:0;outline:none;width:100%;font:inherit}.hint{height:24px;margin:0 20px;color:#92979e;font-size:14.667px}.modules{height:182px;margin:4px 20px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:18px}.tile .caption{display:flex;gap:9px;align-items:center}.tile svg{width:16px;height:16px}.tile small{font-size:14.667px;color:#92979e}.tile.active{background:#2f3339}.content{flex:1;min-height:0;margin:10px 20px 20px;padding:20px 14px;background:#181a1d;border:1px solid #34373c;border-radius:12px;overflow:auto}h2{font-size:15.333px;margin:0 0 16px;font-weight:600}.empty{line-height:1.7;color:#92979e;margin:0;font-size:14.667px}.status{display:none;height:44px;color:#92979e;font-size:14.667px;padding:4px 20px}.footer{display:none;height:34px;padding:8px 20px;color:#92979e;font-size:14.667px}.tag{font-size:10px;color:#92979e;margin-top:15px}
</style><body><div class="window"><div class="titlebar"><span>▦ &nbsp; SW Tools Hub</span><span>− □ ×</span></div><main class="app"><header class="header"><strong>SW Tools Hub</strong><div class="toolbar"><button title="Избранные макросы" onclick="show('Избранные инструменты',this)"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></button><button class="disabled" title="Выберите макрос для запуска"><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg></button><button title="Выбрать папку библиотеки" onclick="document.getElementById('status').textContent='В приложении откроется системный выбор папки Windows.'"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10H3Z"/></svg></button></div></header><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input aria-label="Поиск макросов" oninput="document.getElementById('heading').textContent=this.value?'Результаты поиска':'Избранные инструменты'" placeholder="Найти макрос…"></div><div class="hint">Поиск макросов</div><section class="modules"><button class="tile" onclick="show('Детали',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 3 9 5v10l-9 5-9-5V8Zm0 10 9-5M3 8l9 5v10"/></svg>Детали</span><small>0 макросов</small></button><button class="tile" onclick="show('Чертежи',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5Zm10 0v5h4M8 12h8M8 16h5"/></svg>Чертежи</span><small>0 макросов</small></button><button class="tile" onclick="show('Сборки',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 2 5 3v6l-5 3-5-3V5Zm-5 9-5 3v6l5 3 5-3v-6Zm10 0-5 3v6l5 3 5-3v-6Z"/></svg>Сборки</span><small>0 макросов</small></button><button class="tile" onclick="show('Лазер',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M7 3h10v5l-5 4-5-4Zm5 9v7M3 21h18M6 13l-3 3m15-3 3 3"/></svg>Лазер</span><small>0 макросов</small></button></section><section class="content"><h2 id="heading">Избранные инструменты</h2><p class="empty" id="empty">Нажмите ☆ рядом с макросом в разделе,<br>чтобы добавить его в избранное.</p></section><div class="status" id="status">Добавьте .swp в папки разделов библиотеки.</div><footer class="footer">0 инструментов · Portable</footer></main></div><script>function show(title,button){document.querySelectorAll('.tile').forEach(x=>x.classList.remove('active'));if(button.classList.contains('tile'))button.classList.add('active');document.getElementById('heading').textContent=title;document.getElementById('empty').innerHTML=title==='Избранные инструменты'?'Нажмите ☆ рядом с макросом в разделе,<br>чтобы добавить его в избранное.':'Макросов пока нет. Добавьте .swp в папку<br>«'+title+'» выбранной библиотеки.'}</script></body></html>

<!doctype html><html lang="ru"><meta charset="utf-8"><title>SW Tools Hub — предварительный просмотр</title><style>
@font-face{font-family:'Source Sans 3';src:url('../../addin/portable/Fonts/SourceSans3-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#EDE4DF;display:flex;justify-content:center;color:#24231F;font:700 18.667px 'Source Sans 3','Segoe UI',Arial,sans-serif}
.window{width:902px;height:633px;min-width:420px;min-height:240px;max-width:calc(100vw - 40px);display:flex;flex-direction:column;overflow:hidden;resize:both;background:#FDFCF8;border:1px solid #E3DCCF;border-radius:8px;box-shadow:0 16px 50px #0005}
.titlebar{height:31px;flex-shrink:0;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#F5EDE8;color:#18191c;font:400 12px 'Segoe UI',Arial,sans-serif}
.titlebar span:last-child{letter-spacing:17px}
.app{--s:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;container-type:inline-size}
.page{min-height:100%;display:flex;flex-direction:column}
.header{height:calc(64px * var(--s));min-height:52px;padding:calc(12px * var(--s)) calc(18px * var(--s)) calc(12px * var(--s)) calc(20px * var(--s));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
strong,h2{font-size:18.667px;font-weight:700}
.toolbar{display:flex;gap:calc(4px * var(--s))}
button,input{font:inherit}
button{cursor:pointer;color:inherit;background:#F8F3E8;border:1px solid #E3DCCF;border-radius:16px}
svg{width:calc(24px * var(--s));height:calc(24px * var(--s));fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.toolbar button,.row-star,.row-play{width:calc(36px * var(--s));height:calc(36px * var(--s));padding:0;display:grid;place-items:center;background:#FCF7F0;border:1px solid #DEC7B1;border-radius:50%;flex-shrink:0}
.toolbar button{color:#C6532E;aspect-ratio:1/1;align-self:center}
.toolbar button:hover,.row-star:hover,.row-play:hover{background:#F6E8DA}
.toolbar .disabled{opacity:.35}
.search{height:max(42px,calc(48px * var(--s)));margin:0 calc(20px * var(--s)) calc(8px * var(--s));padding:calc(8px * var(--s)) calc(12px * var(--s));display:flex;align-items:center;gap:calc(8px * var(--s));background:#F8F3E8;border:1px solid #E3DCCF;border-radius:16px;flex-shrink:0}
.search svg{width:calc(18px * var(--s));height:calc(18px * var(--s));color:#706D61}
.search input{width:100%;min-width:0;padding:0;border:0;outline:0;background:transparent;color:#24231F}
.search input::placeholder{color:#706D61;opacity:1}
.hint{height:max(26px,calc(30px * var(--s)));margin:0 calc(20px * var(--s));color:#706D61;font-size:18px;flex-shrink:0}
.modules{height:calc(112px * var(--s));margin:calc(4px * var(--s)) calc(20px * var(--s)) calc(8px * var(--s));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(8px * var(--s));flex-shrink:0}
.tile{text-align:left;min-width:0;padding:calc(12px * var(--s)) calc(14px * var(--s));display:flex;flex-direction:column;justify-content:center;gap:calc(8px * var(--s));background:#F8F3E8}
.tile .caption{display:flex;gap:calc(8px * var(--s));align-items:center}
.tile svg{color:#C6532E}
.tile small{font-size:17.333px;color:#706D61;padding-left:calc(32px * var(--s))}
.tile:hover,.tile.active{background:#F0E7D8;border-color:#C6C2B5}
.content{flex:1;min-height:calc(240px * var(--s));margin:calc(10px * var(--s)) calc(20px * var(--s)) calc(20px * var(--s));padding:calc(16px * var(--s)) calc(14px * var(--s));overflow:visible;background:#F8F3E8;border:1px solid #E3DCCF;border-radius:16px}
h2{margin:0 0 calc(16px * var(--s))}
.empty{margin:0;color:#706D61;font-size:17.333px;line-height:1.6}
.macro-row{display:grid;grid-template-columns:calc(40px * var(--s)) minmax(0,1fr) calc(40px * var(--s));min-height:calc(80px * var(--s));align-items:stretch;gap:calc(4px * var(--s));margin-bottom:calc(8px * var(--s));padding-bottom:calc(8px * var(--s));border-bottom:1px solid #E3DCCF}
.macro-row button{min-width:0}
.macro-name{padding:calc(6px * var(--s));text-align:left;background:transparent;border-color:transparent;border-radius:12px}
.macro-name span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.macro-name small{display:block;margin-top:calc(5px * var(--s));color:#706D61;font-size:17.333px}
.macro-name:hover,.macro-name.selected{background:#F0E7D8}
.row-star,.row-play{align-self:center;justify-self:center;color:#C6532E}
.row-play,.toolbar button{transition:background-color .14s ease,color .14s ease,border-color .14s ease}
.row-play svg,.toolbar button svg{transition:transform .14s ease}
.row-play:hover,.toolbar button:hover{background:#C6532E;color:#FFF;border-color:#C6532E}
.row-play:hover svg,.toolbar button:hover svg{transform:scale(1.2)}
button:focus-visible{outline:2px solid #706D61;outline-offset:2px}
.search:focus-within{border-color:#706D61}
.status,.footer{display:none}
@container (max-width:719px){.modules{grid-template-columns:repeat(2,minmax(0,1fr));height:calc(224px * var(--s))}}
.app::-webkit-scrollbar{width:12px}.app::-webkit-scrollbar-track{background:#F6F2EA}.app::-webkit-scrollbar-thumb{background:#C5BCAF;border:3px solid #F6F2EA;border-radius:8px}.app::-webkit-scrollbar-thumb:hover{background:#AFA18E}
.tile{transition:background-color .14s ease,color .14s ease,border-color .14s ease}.tile svg{transition:transform .14s ease,color .14s ease}
.tile:hover{background:#C6532E;color:#FFFFFF;border-color:#C6532E}.tile:hover svg,.tile:hover small{color:#FFFFFF}.tile:hover svg{transform:scale(1.2)}
</style><body><div class="window"><div class="titlebar"><span>▦ &nbsp; SW Tools Hub</span><span>− □ ×</span></div><main class="app"><div class="page"><header class="header"><strong>SW Tools Hub</strong><div class="toolbar"><button title="Выбрать папку библиотеки" onclick="document.getElementById('status').textContent='В приложении откроется системный выбор папки Windows.'"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10H3Z"/></svg></button></div></header><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input aria-label="Поиск макросов" oninput="render()" placeholder="Найти макрос…"></div><div class="hint">Поиск макросов</div><section class="modules"><button class="tile" onclick="show('Избранное',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg>Избранное</span><small>0 макросов</small></button><button class="tile" onclick="show('Чертежи',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5Zm10 0v5h4M8 12h8M8 16h5"/></svg>Чертежи</span><small>0 макросов</small></button><button class="tile" onclick="show('Сборки',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="m12 2 5 3v6l-5 3-5-3V5Zm-5 9-5 3v6l5 3 5-3v-6Zm10 0-5 3v6l5 3 5-3v-6Z"/></svg>Сборки</span><small>0 макросов</small></button><button class="tile" onclick="show('Лазер',this)"><span class="caption"><svg viewBox="0 0 24 24"><path d="M7 3h10v5l-5 4-5-4Zm5 9v7M3 21h18M6 13l-3 3m15-3 3 3"/></svg>Лазер</span><small>0 макросов</small></button></section><section class="content"><h2 id="heading">Избранные инструменты</h2><div id="rows"></div><p class="empty" id="empty">Нажмите ☆ рядом с макросом в разделе,<br>чтобы добавить его в избранное.</p></section><div class="status" id="status">Добавьте .swp в папки разделов библиотеки.</div><footer class="footer">0 инструментов · Portable</footer></div></main></div><script>
// Данные только для предварительного просмотра: рабочие .swp не добавляются.
const macros=[{name:'Авторазмер Рамы',category:'Чертежи',favorite:true},{name:'Экспорт DXF',category:'Лазер',favorite:true}];
let section=null, selected=null;
function macroCount(value){const form=new Intl.PluralRules('ru').select(value);return value+' '+({one:'макрос',few:'макроса',many:'макросов',other:'макроса'}[form])}
function show(title,button){if(title==='Избранное'){section=null;document.querySelector('input').value=''}else section=section===title?null:title;render()}
function render(){const query=document.querySelector('input').value.trim().toLowerCase();const home=!section&&!query;document.getElementById('heading').textContent=home?'Избранные инструменты':query?'Результаты поиска':section;document.querySelectorAll('.tile').forEach((tile,i)=>{const category=['Избранное','Чертежи','Сборки','Лазер'][i];tile.classList.toggle('active',i===0?section===null:section===category);tile.querySelector('small').textContent=macroCount(macros.filter(m=>i===0?m.favorite:m.category===category).length)});const visible=macros.filter(m=>(!section||m.category===section)&&(!home||m.favorite)&&m.name.toLowerCase().includes(query));const rows=document.getElementById('rows');rows.replaceChildren();visible.forEach(m=>{const row=document.createElement('div');row.className='macro-row';const star=document.createElement('button');star.className='row-star';star.innerHTML='<svg viewBox="0 0 24 24" style="fill:'+(m.favorite?'#F3B28A':'none')+'"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg>';star.title=(m.favorite?'Убрать из избранного: ':'В избранное: ')+m.name;star.onclick=()=>{m.favorite=!m.favorite;render()};const name=document.createElement('button');name.className='macro-name'+(selected===m?' selected':'');const title=document.createElement('span');title.textContent=m.name;name.append(title);if(home){const subtitle=document.createElement('small');subtitle.textContent=m.category;name.append(subtitle)}name.onclick=()=>{selected=m;render()};const play=document.createElement('button');play.className='row-play';play.title='Запустить: '+m.name;play.innerHTML='<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg>';play.onclick=()=>{selected=m;render()};row.append(star,name,play);rows.append(row)});document.getElementById('empty').style.display=visible.length?'none':'block';document.getElementById('empty').textContent=home?'Нажмите ☆ рядом с макросом в разделе, чтобы добавить его в избранное.':'Макросов пока нет. Измените запрос или раздел.'}

render();
const app=document.querySelector('.app');
new ResizeObserver(()=>app.style.setProperty('--s',Math.max(.8,Math.min(1.5,app.clientWidth/900)))).observe(app);
</script></body></html>
